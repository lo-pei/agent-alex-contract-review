# 100 题检索评测：概念标签 → 语料片段匹配器（ISSUE-018）
#
# 背景：`data/knowledge/100问题.md` 的“期望 source_id”是概念标签（CISG-25 / INC-CIF A5 /
# JI-CC-1），语料实际引用是 `CISG-ZH#第二十五条` / `INCOTERMS-2020#s12` /
# `SPC-CONTRACT-2023#第一条`。两者不同名，必须先映射才能算召回。
#
# 约定：
# - 这里的 `labels` 只登记**需要人工判断**的标签；`CISG-N` / `CC-N` / `LAW-N` / `JI-CC-N`
#   由 `eval/rag_gold.py` 的通用规则解析（第 N 条 ↔ 第{中文数字}条）。
# - `heading` 是**对 chunk.heading 的正则**（`re.search`），命中同一 heading 的多个切片
#   全部计入可接受集合。
# - `gaps` 登记“语料里确实没有对应文本”的标签；含该标签的题目不进召回率分母，
#   单独统计为“语料未覆盖”，不把语料缺口算成检索失败。
version: 1
provenance: >-
  由 `eval/rag_gold.py` 解析 `data/knowledge/100问题.md` 生成；标签到语料的对应关系
  按语义人工登记（INCOTERMS-2020 为专题整理稿，无逐条 A/B 编号；RISK-REDLINE 未按编号组织）。

