# 规则集（阶段 3：5 条文本规则 + 2 条依赖抽取字段的规则；阶段 4 扩充 6 条文本规则）
# 契约：app/rules/engine.py 的 RuleDefinition（rule_id/title/category/risk_level/reason/
#       suggestion/requires_fields/requires_extraction/condition/source）
# 说明：
# - 这里只放“能用确定性文本/字段判定”的规则；语义型规则（如“赔偿上限是否过低”）先不做。
# - 规则只代表业务风险提示，不是法律结论；报告必须保留 limitation。
# - `requires_extraction: true`：抽取整体不可用（未配置 Key / 失败）时该规则标记 skipped，
#   不计入 pass 也不误报 yellow，避免把“抽取失败”说成“合同缺少该要素”。
# - 阶段 4 新增的 6 条规则（R-DIS-003/004、R-INS-001、R-INC-001/002、R-INP-002）
#   均先在 data/contracts 的 50 份模拟合同上验证命中集合（每条只命中预期合同，
#   两份样例合同零命中），验证方式与结果见 ADR-010 与 eval/results/。
# - 继续扩充时：先写 fixture、再在语料上验证命中集合，最后并入规则集（ISSUE-009）。
# - version 4（阶段 4 第 3 轮，ISSUE-021）：给 R-DIS-003/004、R-INS-001、R-INC-001、R-INP-002
#   补英文与同义改写表达。改动依据是上一轮独立留出集暴露的 2 个真实漏报
#   （H01 英文“或裁或审”、H03“费用由卖方承担并预付”）；验收改用新写的
#   data/contracts_holdout2（H09–H20），避免用旧留出集调参（ADR-011 留出纪律）。
# - version 5（阶段 4 第 4 轮，ISSUE-021 第 2 步）：修 holdout3 暴露的 3 类写法
#   （中文并列“亦可”、运费条款“卖方负责支付”、英文数词“thirty-six (36) hours”），
#   并把 R-INS-001 的“已写保额”判定从全文级收窄为“保险关键字邻近”（不再被付款比例压制）。
#   验收改用新写的 data/contracts_holdout4（H29–H38），holdout3 同时降级为回归集。
# - version 6（阶段 4 第 5 轮，ISSUE-021 第 3 步）：修 holdout4 暴露的 H39 漏报——
#   英文情态动词与动词之间插入时间状语（“may, within 30 days …, commence proceedings”），
#   允许 80 字符以内的间隔；同时保留“裁决的法定执行/撤销救济”不误报。
#   验收改用新写的 data/contracts_holdout5（H41–H52），holdout4 同时降级为回归集。
# - version 7（阶段 4 第 6 轮，ISSUE-021 第 4 步）：修 holdout6（H53–H64，纯英文）暴露的
#   3 个英文写法缺口——FOB 下“Seller shall arrange and pay for the ocean freight”倒装、
#   “or, at the Buyer's option, by proceedings …”连接词后带逗号、
#   “pay the entire contract price before shipment”未写“in advance”。
#   盲测基线（改规则之前）= P=1.00 / R=0.727 / F1=0.842；修后本批降级为回归集，
#   另写 holdout7 才能再对外报数（ADR-011 第 5/6 轮补充）。
# - version 8（阶段 4 第 7 轮第二步，ISSUE-021 第 5 步）：修 holdout7（H65–H76，中英混合）暴露的
#   4 个写法缺口——H65 “the ocean freight … shall be for the Seller's account”（迂回语态，R-INC-001）、
#   H66 仲裁句与法院句分属两句（跨句“或裁或审”，R-DIS-003）、H67 中文“装运前一次性支付合同项下全部价款”
#   （R-PAY-001）、H69 “bring the matter before the courts”（R-DIS-004）。
#   盲测基线（改规则之前）= P=1.00 / R=0.636 / F1=0.778；修后 holdout7 降级为回归集，
#   下一批对外数字须来自新写的 holdout8。
# - version 9（阶段 4 第 9 轮，ISSUE-021 第 7 步）：修 holdout8（H77–H88，中英混合）盲测基线暴露的
#   5 个写法缺口——H77 “The ocean freight … is on the Seller's account”（介词短语，R-INC-001）、
#   H78 “refer the dispute to the courts”（跨句，动词是 refer，R-DIS-003）、
#   H79 中文“付清全部货款；卖方在收到全部货款后安排装运”（R-PAY-001）、
#   H80 “对裁决不服的一方…向…法院提起上诉”（R-DIS-004）、
#   H83 “inspect … immediately upon discharge / notify … on the same day”（R-INP-002）。
#   基线（改规则之前）= P=1.00 / R=0.545 / F1=0.706；修后 holdout8 降级为回归集，
#   再报新数字须先写 holdout9。
# - version 10（阶段 4 第 10 轮，ISSUE-021 第 8 步）：修 holdout9（H89–H100，中英混合）盲测基线
#   暴露的 5 个写法缺口——H89 “The price is inclusive of all freight charges up to …”
#   （价格已含运费，R-INC-001）、H90 “Either party may instead elect to have any dispute decided
#   by the courts”（“instead” 式选择权，R-DIS-003；该条仲裁句含 “the award shall be final”，
#   原跨句分支的 award 守卫会拦住，故单列一条）、H91 中文“将全部合同价款…汇入…卖方确认收款后
#   方可发运”（R-PAY-001）、H92 中文“向…人民法院请求重新审理”（R-DIS-004）、
#   H93 检验期限写成中文数字“二十四小时”（R-INP-002）。
#   基线（改规则之前，version 9）= P=1.00 / R=0.545 / F1=0.706；修后 holdout9 降级为回归集，
#   再报新数字须先写 holdout10。

version: 10

rules:
  - rule_id: R-TRD-001
    title: 贸易术语未约定 Incoterms 版本
    category: trade_term
    risk_level: yellow
    reason: >-
      合同使用了贸易术语，但未注明 Incoterms 版本，风险转移节点与费用划分可能产生歧义。
    suggestion: 写成带版本的完整术语，例如“FOB Shanghai, Incoterms 2020”。
    requires_fields: []
    condition:
      type: all_of
      conditions:
        - type: regex_match
          # 前后不能用英文字母，但允许紧跟中文（“FOB上海”也算术语）。
          # 不能用 contains_any：会把 “specification / Pacific” 里的 cif 当成贸易术语。
          pattern: "(?<![A-Za-z])(?:FOB|CIF|CFR|EXW|DDP|DAP|FCA)(?![A-Za-z])"
        - type: none_of
          conditions:
            # ICC 官方写法常带 ®（Incoterms® 2020），不能漏掉该符号
            - type: regex_match
              pattern: "Incoterms\\s*[®™]?\\s*(?:19|20)\\d{2}"
    source: 国际货物销售合同常见争议点：贸易术语版本歧义（业务规则）
    version: "1.2"

  - rule_id: R-PAY-001
    title: 要求买方全额预付货款
    category: payment
    risk_level: red
    reason: >-
      合同要求买方在发货前全额付款，买方承担卖方不履约时的全部资金风险。
    suggestion: 改为分阶段付款（如 30% 预付 + 70% 见提单副本），或改用信用证（L/C）。
    requires_fields: []
    condition:
      type: any_of
      conditions:
        - type: contains_any
          keywords:
            - "100% advance payment"
            - "payment in advance"
            - "full payment in advance"
            - "全额预付"
            - "预付全款"
        - type: regex_match
          # 英文同义写法（holdout6 H61）：“pay the entire contract price before shipment”。
          # 只收 entire/full/whole/100% of the 这种“全部”限定，避免把
          # “the balance shall be paid before shipment”（分期付款的正常约定）误判为全额预付。
          pattern: "(?:entire|full|whole|100\\s*%\\s*of\\s*the)\\s+(?:contract\\s+)?(?:price|value|amount|payment)[^.]{0,80}?(?:in\\s+advance|before\\s+(?:shipment|delivery|dispatch)|prior\\s+to\\s+(?:shipment|delivery)|upon\\s+signing)"
        - type: regex_match
          # 中文同义写法（holdout7 H67）：“买方应于装运前一次性支付合同项下全部价款”。
          # 两个条件都要：①装运/发货/交货/出运前；②“一次性/一次支付”+“全部/全额价款”。
          # 末尾负向断言排除“装运前一次性支付全部价款的 30%”这类分期写法（后面紧跟百分比即不算全额）。
          pattern: "(?:(?:装运|发货|交货|出运|交付)前[^。]{0,24}?(?:一次性|一次|全额)?\\s*支付[^。]{0,24}?(?:全部|全额)(?:价款|货款|款项|合同价)(?![^。]{0,6}\\d{1,3}\\s*%)|(?:一次性|一次)\\s*支付[^。]{0,24}?(?:全部|全额)(?:价款|货款|款项)(?![^。]{0,6}\\d{1,3}\\s*%)[^。]{0,24}?(?:装运|发货|交货|出运)前)"
        - type: regex_match
          # 中文“先收全款再发货”（holdout8 H79）：“买方应于本合同签订后七个工作日内付清全部货款；
          # 卖方在收到全部货款后安排装运”。不依赖“一次性/装运前”这类措辞，直接认
          # “收到/收讫 + 全部货款 + 后/再 + 装运/发货”，语义上就是全额预付。
          pattern: "(?:收到|收讫)[^。]{0,12}?(?:全部|全额)(?:价款|货款|款项)[^。]{0,20}?(?:后|再)[^。]{0,24}?(?:装运|发货|出运|交货)"
        - type: regex_match
          # “全部价款已收妥才发运”的另一写法（holdout9 H91）：“将全部合同价款一次性汇入卖方指定账户；
          # 卖方确认收款后方可发运”。与前一条不同，这里没有“收到/收讫 + 全部货款”，而是
          # “确认收款后 + 发运”，所以要求同一句里既有“全部/全额价款”，又有“确认收款后发运”。
          # 只写“确认收款后发货”而没写“全部/全额”的不收（可能只是 30% 定金后的发货）。
          pattern: "(?:全部|全额)[^。]{0,30}?(?:价款|货款|款项)[^。]{0,60}?(?:确认|收到|收讫)[^。]{0,10}?收款[^。]{0,12}?(?:后|再)[^。]{0,20}?(?:发运|装运|发货|出运|交货)"
    source: 国际贸易付款风险控制惯例（业务规则）
    version: "1.3"

  - rule_id: R-PAY-002
    title: 未约定付款方式或付款节点
    category: payment
    risk_level: yellow
    reason: >-
      合同未出现付款方式/节点相关表述，可能导致发货后收款依据不足。
    suggestion: 明确付款方式（T/T、L/C、O/A）、比例与时间节点。
    requires_fields: []
    condition:
      type: none_of
      conditions:
        - type: contains_any
          keywords: [payment, "T/T", "L/C", 信用证, 付款]
    source: 国际货物销售合同常见争议点：付款条款缺失（业务规则）
    version: "1.0"

  - rule_id: R-DLV-001
    title: 未约定交付期限
    category: delivery
    risk_level: yellow
    reason: >-
      未抽取到明确的交付日期或装运期限，卖方履约时间缺少可执行约束，买方难以主张逾期。
    suggestion: >-
      明确交付日期，或约定“收到信用证/预付款后 N 天内装运”，并写明逾期处理方式。
    requires_fields: []
    requires_extraction: true
    condition:
      type: field_missing
      field: delivery_date
    source: 国际货物销售合同常见争议点：交付期限缺失（业务规则）
    version: "1.0"

  - rule_id: R-INP-001
    title: 未约定检验标准或检验机构
    category: inspection
    risk_level: yellow
    reason: >-
      未抽取到检验标准或检验机构约定，货物质量争议缺少双方认可的判定依据。
    suggestion: 约定检验机构（如 SGS/BV）、检验标准、检验地点与检验证书效力。
    requires_fields: []
    requires_extraction: true
    condition:
      type: field_missing
      field: inspection_standard
    source: 国际货物销售合同常见争议点：检验条款缺失（业务规则）
    version: "1.0"

  - rule_id: R-DIS-001
    title: 未约定适用法律
    category: dispute
    risk_level: red
    reason: >-
      合同未约定适用法律，发生争议时缺少可预期的法律依据，准据法需另行确定。
    suggestion: 增加 Governing Law / 适用法律条款，明确具体国家或地区的法律。
    requires_fields: []
    condition:
      type: none_of
      conditions:
        - type: contains_any
          keywords:
            - governing law
            - applicable law
            - "shall be governed by"
            - 适用法律
            - 法律适用
    source: 国际货物销售合同常见争议点：准据法缺失（业务规则）
    version: "1.0"

  - rule_id: R-DIS-002
    title: 未约定争议解决方式
    category: dispute
    risk_level: red
    reason: >-
      合同未约定仲裁或诉讼管辖安排，争议发生时可能产生管辖权争议与额外成本。
    suggestion: 明确仲裁机构/规则/地点，或约定有管辖权的法院。
    requires_fields: []
    condition:
      type: none_of
      conditions:
        - type: contains_any
          keywords: [arbitration, 仲裁, jurisdiction, 管辖, "competent court", 诉讼]
    source: 国际货物销售合同常见争议点：争议解决条款缺失（业务规则）
    version: "1.0"

  # ---------- 阶段 4 扩充（均在 50 份模拟合同上验证过命中集合） ----------

  - rule_id: R-DIS-003
    title: 仲裁与诉讼并列约定（“或裁或审”）
    category: dispute
    risk_level: red
    reason: >-
      争议解决条款把“提交仲裁”和“向法院起诉”并列为可选路径，且未写明选择权归属与先后顺序，
      仲裁协议可能被认定为约定不明，争议发生时先产生管辖权争议。
    suggestion: >-
      二选一：删除诉讼选项，写明仲裁机构、仲裁规则、仲裁地与仲裁语言；
      或改为明确阶梯条款（先仲裁，仅在对裁决不服时按法定情形申请救济）。
    requires_fields: []
    condition:
      type: any_of
      conditions:
        - type: regex_match
          # 中文：命中的是“仲裁 … 或/亦可/有权 … 法院/诉讼”这一句内并列结构；[^。] 允许换行但拦截跨句。
          # “亦可 / 也可以 / 仍有权 / 有权 / 可选择”都是实务中写“或裁或审”的同义连接词（holdout3 H21）。
          pattern: "仲裁[^。]{0,60}(?:或|或者|亦可|也可以|仍有权|亦有权|有权|可选择)[^。]{0,40}(?:人民法院|法院|诉讼)"
        - type: regex_match
          # 英文：“arbitration … or … court/litigate”同一句内的并列结构。
          # 用 \\s+or[,\\s] 而不是裸 or，避免误吃 arbitrator / order / for 等词；
          # 连接词后允许逗号（holdout6 H55：“the SIAC Rules or, at the Buyer's option,
          # by proceedings in the courts of Singapore”）。
          pattern: "arbitrat[a-z]*[^.]{0,120}?\\s+or[,\\s]\\s*[^.]{0,80}?(?:court|litigat[a-z]*)"
        - type: regex_match
          # 跨句写法（holdout7 H66）：仲裁句先结束（“… under the HKIAC Administered Arbitration Rules.”），
          # 下一句才写“If the dispute has not been resolved …, either party may commence proceedings in the courts …”。
          # 两个限制防止误报：
          # ① 中间不许出现 “award”——出现即属“裁决后起诉”，该由 R-DIS-004 判（holdout4 H39 / holdout5 H41 实测）；
          # ② 中间不许出现新的条/条号标题（第N条 / Article N / Clause N），把跨句限制在同一争议解决条款内。
          # ③ 动词集合补 refer（holdout8 H78：“Alternatively, the Buyer may refer the dispute to the courts of Singapore.”）；
          #    用 \\brefer 而不是裸 refer，避免把 prefer 当成 refer。
          pattern: "arbitrat[a-z]*[^.]{0,140}?\\.(?:(?!(?:award|第[一二三四五六七八九十百\\d]+条|Article\\s+\\d+|Clause\\s+\\d+))[\\s\\S]){0,200}?(?:either\\s+party|a\\s+party|the\\s+(?:buyer|seller|claimant|respondent|parties))[^.]{0,100}?(?:commence|bring\\s+(?:an\\s+)?(?:action|suit|proceedings?)|\\brefer[a-z]*|file|initiate|sue\\b|litigat[a-z]*|submit)[^.]{0,100}?(?:court|litigat[a-z]*)"
        - type: regex_match
          # “instead” 式选择权（holdout9 H90）：“Either party may instead elect to have any dispute
          # decided by the courts of Singapore.” 前面那句仲裁条款已写 “the award shall be final and
          # binding”，上一条跨句分支的 award 守卫会故意拦住它，所以单列一条。
          # 只认 “may/shall… instead/alternatively … elect/choose/opt/have … decided by … court”，
          # 不收 “instead of enforcing the award …”（对裁决的执行/救济，属正常条款）。
          pattern: "arbitrat[a-z]*[^.]{0,140}?\\.(?:(?!(?:第[一二三四五六七八九十百\\d]+条|Article\\s+\\d+|Clause\\s+\\d+))[\\s\\S]){0,220}?(?:either\\s+party|a\\s+party)[^.]{0,60}?\\b(?:may|shall|can|could)\\b[^.]{0,40}?(?:instead|alternatively)[^.]{0,50}?(?:elect|choose|opt|have)[^.]{0,80}?(?:decided\\s+by[^.]{0,20}?(?:court|tribunal)|court|litigat[a-z]*)"
    source: 国际货物销售合同常见争议点：“或裁或审”条款效力（业务规则）
    version: "1.4"

  - rule_id: R-DIS-004
    title: 约定仲裁裁决后仍可向法院起诉（“先裁后审”）
    category: dispute
    risk_level: red
    reason: >-
      条款约定仲裁裁决作出后当事人仍可就同一争议向法院起诉，实质削弱仲裁的终局性，
      并与合同中“仲裁裁决是终局的”表述相互冲突。
    suggestion: >-
      明确仲裁裁决为终局并对双方有约束力；如需保留司法救济，仅限撤销裁决、
      不予执行裁决等法定情形，并写明依据的准据法。
    requires_fields: []
    condition:
      type: any_of
      conditions:
        - type: regex_match
          pattern: "仲裁裁决[^。]{0,30}后[^。]{0,60}(?:人民法院|法院|诉讼)"
        - type: regex_match
          # 中文“对裁决不服 + 向法院上诉/起诉”（holdout8 H80）：“仲裁庭的裁决为终局裁决…
          # 对该裁决不服的一方，可以在收到裁决书之日起三十日内向新加坡高等法院提起上诉。”
          # 只认“向…法院…上诉/起诉/诉讼”；“申请撤销裁决”属于法定救济（holdout4 H32 / holdout5 H52），不收。
          pattern: "不服[^。]{0,80}?向[^。]{0,20}?法院[^。]{0,12}?(?:上诉|起诉|诉讼)"
        - type: regex_match
          # 中文“请求重新审理”（holdout9 H92）：“任何一方均可向有管辖权的人民法院请求重新审理。”
          # 裁决（含“终局裁决”）之后又给当事人一次“请求重新审理”的机会，实质削弱终局性。
          # 只认 请求/申请/提起 + 重新审理/再审/重新仲裁；不收“申请强制执行 / 申请撤销裁决”等法定救济。
          pattern: "(?:均可|可以|有权|任何一方)[^。]{0,16}?向[^。]{0,20}?法院[^。]{0,12}?(?:请求|申请|提起)[^。]{0,8}?(?:重新审理|再审|重新仲裁)"
        - type: regex_match
          # 英文：裁决之后仍可 bring/file/commence/appeal/litigate/submit … court。
          # 刻意不收 “may be enforced in any court”（裁决的法定执行，属正常条款），
          # 也不收 “may be set aside / apply to set aside”（撤销裁决的法定救济）。
          # 情态动词后可插时间状语（“may, within forty-five (45) days after the award is issued,
          # bring an action”）：holdout4 H39 与 holdout5 H41 都是这一写法，故允许 80 字符以内的间隔
          # （用 \\s* 而非 \\s+，因为状语前通常是逗号而不是空白）。
          # “bring the matter/dispute/case before the court”也是同一语义的写法（holdout7 H69）；
          # 仍不收 “enforced in any court” 与 “set aside” 两类法定救济。
          pattern: "award[^.]{0,140}?\\s+(?:may|shall|can|could)\\s*[^.]{0,80}?(?:bring\\s+(?:an\\s+)?(?:action|suit|proceedings?)|bring\\s+(?:the\\s+)?(?:matter|dispute|case)\\s+(?:before|to)\\s+(?:the\\s+)?courts?|file\\s+(?:a\\s+)?(?:lawsuit|suit|claim)|commence\\s+(?:an\\s+)?(?:action|proceedings?|litigation)|appeal[a-z]*|sue\\b|litigat[a-z]*|submit[a-z]*[^.]{0,40}?\\s+to\\s+(?:the\\s+)?(?:competent\\s+)?court)"
    source: 国际货物销售合同常见争议点：仲裁终局性与后续诉讼（业务规则）
    version: "1.5"

  - rule_id: R-INS-001
    title: CIF/CIP 约定投保但未写明保险金额或比例
    category: trade_term
    risk_level: yellow
    reason: >-
      合同采用 CIF/CIP 并约定由卖方投保，但没有写明保险金额或投保比例。
      Incoterms® 2020 的默认规则（合同价 110%、最低 ICC(C) 险别）可以补位，
      但若合同同时使用“一切险”等与默认险别不一致的措辞，理赔范围仍可能产生争议。
    suggestion: >-
      写明“按 ICC(C)（或双方约定的险别）投保，保额为合同价的 110%”，
      并约定保险单可转让、买方有权直接向保险人索赔。
    requires_fields: []
    condition:
      type: all_of
      conditions:
        - type: regex_match
          # 词边界版本：避免 “Pacific / specification” 里的 cif 被当成 CIF 术语
          pattern: "(?<![A-Za-z])(?:CIF|CIP)(?![A-Za-z])"
        - type: contains_any
          keywords: [保险, 投保, 险别, insurance, insure, insured]
        - type: none_of
          conditions:
            # 已写明金额/比例时视为合规；**但必须是“保险语境邻近”**，
            # 不能用全文级判定——否则合同里任意一处比例（如付款 40%）都会压制本规则（holdout3 H27 实测）。
            # 下面两条分别是“保险关键字在前”“金额在前”，窗口 60/40 字符，跨句仍用 [^。] 拦截。
            - type: regex_match
              pattern: "(?:保险金额|保额|投保金额|保险|投保|险别|insur[a-z]*|insured|sum insured|policy)[^。]{0,60}?(?:\\d{2,3}\\s*%|合同价|发票价|contract price|invoice value|insured value|insurance amount|sum insured)"
            - type: regex_match
              pattern: "(?:\\d{2,3}\\s*%|保险金额|保额|insured value|insurance amount|sum insured)[^。]{0,40}?(?:投保|保险|险别|insur[a-z]*|insured)"
            # 英文金额写法：insured value of USD 100,000 / sum insured USD …
            - type: regex_match
              pattern: "(?:sum insured|insured\\s+(?:value|amount)|insurance\\s+(?:amount|value)|amount\\s+of\\s+insurance)[^.]{0,40}?(?:USD|EUR|CNY|RMB|\\d)"
    source: Incoterms® 2020 CIF/CIP 保险义务与合同约定不一致（业务规则）
    version: "1.2"

  - rule_id: R-INC-001
    title: 贸易术语与运费承担约定相互矛盾
    category: trade_term
    risk_level: yellow
    reason: >-
      合同采用 FOB/EXW/FCA 等由买方负责主运输的术语，却又约定运费由卖方预付或承担，
      费用划分存在两种口径，履约与索赔时需先确定以术语还是以费用条款为准。
    suggestion: >-
      统一口径：若确实由卖方承担主运费，改用 CFR/CIF/CPT/CIP 并写明目的地；
      若坚持 FOB/EXW/FCA，则删除“运费由卖方承担”的约定。
    requires_fields: []
    condition:
      type: any_of
      conditions:
        - type: regex_match
          # [\s\S] 允许跨行/跨句（真实合同里术语与运费条款常分处两条），距离上限 260 字符
          # （H03 实测 134；H19 因“Freight and Charges”小标题插在中间，实测 210）。
          # 术语前后排除英文字母（允许紧跟中文），避免 “specification / Pacific” 之类的子串误命中。
          # 中文侧允许“海运费及舱位订舱费用由卖方承担 / 卖方承担至鹿特丹的主运费 / 卖方负责支付…主运费”三种语序；
          # 只收运费类费用（运费/海运费/运输费用/订舱费），不收“报关费用”等本就应由卖方负担的费用；
          # 倒装语序的间隔里排除中英文逗号/句号，避免把“卖方承担，主运费由买方承担”误读为卖方付运费；
          # 情态/动词前缀（负责/应/须/将/同意）允许出现（holdout3 H22“卖方负责支付”）。
          pattern: "(?<![A-Za-z])(?:FOB|EXW|FCA)(?![A-Za-z])[\\s\\S]{0,260}(?:(?:海运费|运费|运输费用|订舱费用|订舱费)[^。]{0,20}?由(?:the )?卖方(?:承担|预付|支付)|卖方(?:负责|应|须|将|同意)?(?:承担|预付|支付)[^。，,]{0,14}?(?:海运费|运费|订舱费用|订舱费)|freight[^.]{0,60}?(?:prepaid|paid|borne) by (?:the )?seller)"
        - type: regex_match
          # 英文倒装语序（holdout6 H53）：“The Seller shall arrange and pay for the ocean freight
          # from Qingdao to Bremen”。只认“卖方 + 付运费的动词”，且动词与运费名词之间不跨句；
          # 不收裸 “pay”，避免把“Seller shall arrange shipment and the Buyer shall pay the freight”
          # 误读成卖方付运费（买方付运费的 FOB 是正常约定）。
          pattern: "(?<![A-Za-z])(?:FOB|EXW|FCA)(?![A-Za-z])[\\s\\S]{0,260}(?:seller|卖方)[^.]{0,40}?(?:arrange\\s+and\\s+pay\\s+for|pay\\s+for|prepay|bear|defray)[^.]{0,24}?(?:ocean\\s+freight|sea\\s+freight|freight|carriage)"
        - type: regex_match
          # 迂回语态（holdout7 H65）：“The ocean freight … shall be for the Seller's account”。
          # 只认“运费 + 记在卖方账上/由卖方承担费用”这一组合，不认 “for the Buyer's account”
          # （FOB 下买方付运费是正常约定）；“at the Seller's risk” 也不收，风险不等于运费承担。
          # 介词短语（holdout8 H77）：“The ocean freight … is on the Seller's account”，故 (?:for|on)；
          # 同时保留 “at the Seller's expense / cost” 这一分支（语料里暂无，但属于常见写法，不能悄悄丢能力）。
          pattern: "(?<![A-Za-z])(?:FOB|EXW|FCA)(?![A-Za-z])[\\s\\S]{0,260}(?:freight|carriage)[^.]{0,40}?(?:shall\\s+be|is|are|will\\s+be|to\\s+be)\\s+(?:(?:for|on)\\s+(?:the\\s+)?seller'?s?\\s+account|at\\s+(?:the\\s+)?seller'?s?\\s+(?:expense|cost))"
        - type: regex_match
          # “价格已含运费”（holdout9 H89）：“The price is inclusive of all freight charges up to
          # Jebel Ali.” 在 FOB/EXW/FCA 合同里写“价格包含运费”，等于卖方实际承担主运费，与术语矛盾。
          # 只认 price/amount/quotation + inclusive of + freight/carriage，
          # 不收 “price inclusive of packing / taxes” 这类与主运费无关的费用。
          pattern: "(?<![A-Za-z])(?:FOB|EXW|FCA)(?![A-Za-z])[\\s\\S]{0,260}(?:price|amount|quotation)[^.]{0,40}?(?:is|are|shall\\s+be)?\\s*inclusive\\s+of[^.]{0,40}?(?:freight|carriage|transportation|shipping)"
    source: Incoterms® 2020 术语与费用条款一致性（业务规则）
    version: "1.5"

  - rule_id: R-INC-002
    title: FOB/EXW 用于整箱集装箱货物
    category: trade_term
    risk_level: yellow
    reason: >-
      FOB/EXW 以“货物装上船/在卖方场所交付”为风险转移点，而整箱集装箱货物通常在集装箱堆场
      交给承运人；卖方难以控制装船节点，按 FOB/EXW 起草的装船义务可能不可履行。
    suggestion: >-
      集装箱整箱运输通常应改用 FCA，并写明交货地（堆场/CY）；
      若坚持 FOB/EXW，需明确装箱、集港与装船的责任与费用承担。
    requires_fields: []
    condition:
      type: regex_match
      pattern: "(?<![A-Za-z])(?:FOB|EXW)(?![A-Za-z])[\\s\\S]{0,120}(?:集装箱|FCL|拼箱|LCL|堆场)"
    source: Incoterms® 2020 术语与运输方式匹配（业务规则）
    version: "1.1"

  - rule_id: R-INP-002
    title: 检验或通知期限以小时计（极短）
    category: inspection
    risk_level: yellow
    reason: >-
      合同把检验或通知期限压缩到数小时，买方可能来不及完成检验与取证；
      若货物并非易腐品，该期限可能被认定为不合理地短。
    suggestion: >-
      按货物性质设定可执行期限（如目的港卸货后 14 天）；确需短期限（易腐货物）时，
      写明检验方式、取样安排与通知渠道。
    requires_fields: []
    condition:
      type: any_of
      conditions:
        - type: regex_match
          pattern: "\\d{1,2}\\s*(?:小时|hours?)[^。]{0,30}(?:检验|通知|异议|inspection|notify)"
        - type: regex_match
          # 英文：“48 hours ... inspect / notice / claim”同句结构（H05 这类写法）。
          # 期限可用阿拉伯数字、英文数词，或“thirty-six (36)”这种数词+括号数字的写法（holdout3 H24）。
          pattern: "(?:(?:twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)-(?:one|two|three|four|five|six|seven|eight|nine)|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|\\d{1,2})\\s*(?:\\(\\s*\\d{1,2}\\s*\\)\\s*)?hours?[^.]{0,30}?(?:inspect[a-z]*|examin[a-z]*|notif[a-z]*|notice|claim[a-z]*)"
        - type: regex_match
          # 反向语序：“inspect/examine … within 36 hours”（动词在前、期限在后），H24 即此结构
          pattern: "(?:inspect[a-z]*|examin[a-z]*|notif[a-z]*|notice|claim[a-z]*)[^.]{0,30}?(?:(?:twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)-(?:one|two|three|four|five|six|seven|eight|nine)|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|\\d{1,2})\\s*(?:\\(\\s*\\d{1,2}\\s*\\)\\s*)?hours?"
        - type: regex_match
          # “立即检验”（holdout8 H83）：“The Buyer shall inspect the Goods immediately upon discharge …”。
          # “卸货/到货即检验”没有给取证留出时间，与“小时计”同属极短期限；
          # 只认 inspect/examine + immediately/forthwith/promptly + upon discharge/arrival/…
          pattern: "inspect[a-z]*[^.]{0,40}?(?:immediately|forthwith|promptly)[^.]{0,12}?(?:up)?on\\s+(?:discharge|unloading|arrival|delivery|receipt)"
        - type: regex_match
          # “当日通知”（holdout8 H83 6.2）：“Any defect … shall be notified to the Seller on the same day.”
          pattern: "notif[a-z]*[^.]{0,50}?\\bon\\s+the\\s+same\\s+day\\b"
        - type: regex_match
          # 中文数字期限（holdout9 H93）：“到达雅加达港后二十四小时内完成检验”。
          # 前两条只认阿拉伯数字或英文数词；这里补中文数词（十二 / 二十四 / 四十八 …）。
          # 只认“小时”+ 检验/通知/异议，不碰“二十四个月保质期”这类非检验期限。
          pattern: "[一二三四五六七八九十百]{1,4}\\s*个?\\s*小时[^。]{0,30}?(?:检验|通知|异议)|(?:检验|通知|异议)[^。]{0,30}?[一二三四五六七八九十百]{1,4}\\s*个?\\s*小时"
    source: CISG 第 38/39 条检验与通知期限的可执行性（业务规则）
    version: "1.4"
